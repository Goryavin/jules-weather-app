<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текущее время и погода в Никосии</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Текущее время и погода в Никосии</h1>
        
        <div id="time-info">
            <p>Текущее время: <span id="current-time">--:--:--</span></p>
        </div>
        
        <div id="weather-info">
            <h2>Погода</h2>
            <p>Город: <span id="city-name">Никосия</span></p>
            <p>Температура: <span id="temperature">--</span>°C</p>
            <p>Описание: <span id="weather-description">--</span></p>
            <img id="weather-icon" src="" alt="Иконка погоды">
            <p>Качество воздуха (AQI): <span id="aqi">--</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
